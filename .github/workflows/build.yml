name: NovaPlayer | Android CI & Auto-Release
run-name: "NovaPlayer | Build & Release v2.5.${{ github.run_number }} (#${{ github.run_number }})"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: novaplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish NovaPlayer Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Inject Auto-Incrementing Release Version
        run: |
          BUILD_VER="2.5.${{ github.run_number }}"
          BUILD_CODE=$((250 + ${{ github.run_number }}))
          echo "RELEASE_VERSION=$BUILD_VER" >> $GITHUB_ENV
          echo "RELEASE_CODE=$BUILD_CODE" >> $GITHUB_ENV
          sed -i "s/versionCode = [0-9]\+/versionCode = $BUILD_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$BUILD_VER\"/g" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Build Signed Release APKs
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --build-cache --parallel --max-workers=4 --stacktrace

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-universal-release.apk "release-apks/NovaPlayer-v${{ env.RELEASE_VERSION }}-universal.apk" || true
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-apks/NovaPlayer-v${{ env.RELEASE_VERSION }}-arm64-v8a.apk" || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-apks/NovaPlayer-v${{ env.RELEASE_VERSION }}-armeabi-v7a.apk" || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release-apks/NovaPlayer-v${{ env.RELEASE_VERSION }}-x86_64.apk" || true
          cd release-apks && sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-v${{ env.RELEASE_VERSION }}-APKs
          path: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt

      - name: Publish & Auto-Update Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "Nova Player v${{ env.RELEASE_VERSION }} — Reality Display Engine, YTX Liquid Glass & Dolby Studio"
          make_latest: true
          body: |
            ### ✨ What's New in Nova Player v${{ env.RELEASE_VERSION }}
            - **Rebranded to Nova Player & Instant Pure Black Launch**: Eliminated the startup blue screen with a pure `#000000` AMOLED launch pipeline.
            - **Sony Bravia / X-Reality Display Engine & 6 Colour Profiles**: Real-time GPU video color post-processing supporting `Vivid`, `Saturated`, `Standard`, `Original`, `P3`, and `sRGB` colour modes plus `X-Reality engine`, `Vivid display`, `Triluminous display`, `Natural display`, `Cinema display`, and `Comfort display (Reading mode)`.
            - **Updated YTX Liquid Glass Navigation Bar & Settings**: Ported the latest YTX `LiquidBottomTabs` spring-physics dock, expandable YTX Settings & About screens, and floating blurred studio dialogs.
            - **Force-Working Dolby Atmos, 20-Band Equalizer & Low-Sound Dialogue Booster**: Multi-band `DynamicsProcessing` compressor (`MBC`) + `LoudnessEnhancer` makeup pre-gain ensures loud, crystal-clear dialogue on quiet 5.1/7.1 movies (`DD5.1`, `EAC3`, `AAC`, `DTS`) and forces audio effects across all codecs.
            - **Strict Directional Gesture Lock & Redesigned Volume/Brightness HUD**: Horizontal skip/seek and vertical volume/brightness are strictly angle-locked (`2.2x` ratio) so skipping never triggers volume or brightness jumps.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
