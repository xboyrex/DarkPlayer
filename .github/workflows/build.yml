name: NovaPlayer | Android CI & Auto-Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novaplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NovaPlayer | Build & Release v2.5.${{ github.run_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x ./gradlew

      - name: Configure Optional Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/nova-release.jks
            echo "RELEASE_STORE_FILE=/tmp/nova-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests & Build Release APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testFossDebugUnitTest assembleFossRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts & SHA-256 Checksums
        id: prep
        run: |
          VERSION="2.5.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release_assets
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "release_assets/NovaPlayer-v${VERSION}-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "release_assets/NovaPlayer-v${VERSION}-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "release_assets/NovaPlayer-v${VERSION}-x86_64.apk"
            elif [[ "$base" == *"x86"* ]]; then
              cp "$apk" "release_assets/NovaPlayer-v${VERSION}-x86.apk"
            else
              cp "$apk" "release_assets/NovaPlayer-v${VERSION}-universal.apk"
            fi
          done
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-v${{ steps.prep.outputs.version }}-APKs
          path: release_assets/*

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: Nova Player v${{ steps.prep.outputs.version }}
          body: |
            ## Nova Player v${{ steps.prep.outputs.version }}

            - **Smart Axis-Locked Gestures**: Instant `10s` double-tap skip (`0ms` continuation taps), minimal `2x` speed hold capsule, and zero accidental volume/brightness interference during horizontal seeking.
            - **Clean Single-Control Player HUD**: Single center transport (`Prev | Play/Pause | Next`), floating time pill, and in-player **UI Switcher** popup.
            - **Pure AMOLED & Pure White Theme Engine**: Pitch Black (`#000000`) & Pure White (`#FFFFFF`) paired with Nova Gradient or Material You Dynamic Accent.
            - **Security & Storage Hardening**: Android Keystore AES-256-GCM network credential encryption, PBKDF2-HMAC-SHA256 (120k iterations) Private Vault PIN with lockout protection, Android 14+ partial media access protection, and multi-volume SD/USB scanning.

            ### SHA-256 Checksums
            ```text
            ${{ hashFiles('release_assets/*.apk') }}
            ```
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
