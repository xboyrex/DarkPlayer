name: DarkPlayer | Android CI & Auto-Release
run-name: "DarkPlayer | Build & Release v2.0.${{ github.run_number }} (#${{ github.run_number }})"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: darkplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish DarkPlayer Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Inject Auto-Incrementing Release Version
        run: |
          BUILD_VER="2.0.${{ github.run_number }}"
          BUILD_CODE=$((200 + ${{ github.run_number }}))
          echo "RELEASE_VERSION=$BUILD_VER" >> $GITHUB_ENV
          echo "RELEASE_CODE=$BUILD_CODE" >> $GITHUB_ENV
          sed -i "s/versionCode = [0-9]\+/versionCode = $BUILD_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$BUILD_VER\"/g" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Build Signed Release APKs
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --build-cache --parallel --max-workers=4 --stacktrace

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-universal-release.apk "release-apks/DarkPlayer-v${{ env.RELEASE_VERSION }}-universal.apk" || true
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-apks/DarkPlayer-v${{ env.RELEASE_VERSION }}-arm64-v8a.apk" || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-apks/DarkPlayer-v${{ env.RELEASE_VERSION }}-armeabi-v7a.apk" || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release-apks/DarkPlayer-v${{ env.RELEASE_VERSION }}-x86_64.apk" || true
          cd release-apks && sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DarkPlayer-v${{ env.RELEASE_VERSION }}-APKs
          path: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt

      - name: Publish & Auto-Update Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: "Dark Player v${{ env.RELEASE_VERSION }} — Studio Edition (Build #${{ github.run_number }})"
          make_latest: true
          body: |
            ### NEW & HIGHLIGHTS
            - Frosted Slate-Navy Solid Player UI with instant controls, crisp dialogs & zero self-blur.
            - Redesigned Vertical Volume & Brightness Bar with expandable 5-channel Sound & Vibration panel.
            - Hardware Dolby Atmos DSP & 5-Band Studio Equalizer with Bass Boost, Reverb & Virtualizer.
            - Interactive Haptic Speed Ruler (0.25x–4.0x) with 2x hold-to-boost & A–B Repeat loop control.

            ### PLAYER & DECODER ENGINE
            - Full HW+ (Auto), HW (MediaCodec), SW+ (System), and SW (Bundled FFmpeg) video & audio decoding.
            - 10-bit HEVC, AV1, EAC3, DTS, TrueHD & multi-track MKV playback with automatic decoder fallback.
            - Audio synchronization delay (-5000 ms to +5000 ms), Stereo/Mono/L/R channel routing & Smooth Audio Fade.
            - One-tap frame-accurate Video Screenshot capture saved directly to Pictures/DarkPlayer.

            ### INTERFACE, HUB & STABILITY
            - Instant splash-free app startup with silent background OTA update checks.
            - Fixed Hub navigation for Private Vault, Trash, History, Settings & external video file picker.
            - Cinematic bottom navigation bar & smooth window-level backdrop blur behind active popups.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
