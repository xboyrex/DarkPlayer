name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Verify Navigation3 Dependency Graph
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/darkplayer-navigation3-dependencies.txt"

          ./gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            --console=plain > "$REPORT"

          if grep -Fq 'miuix-navigation3-ui-android' "$REPORT"; then
            echo "::error::Duplicate Miuix Navigation3 UI dependency detected."
            grep -n -C 3 'miuix-navigation3-ui-android' "$REPORT"
            exit 1
          fi

          grep -E 'androidx.navigation3:navigation3-(runtime|ui)' "$REPORT"

          echo "Navigation3 dependency graph verified."

      - name: Validate Android Image Resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import sys

          root = Path(".")
          image_ext = {
              ".png", ".webp", ".jpg", ".jpeg",
              ".gif", ".bmp", ".avif"
          }
          groups = defaultdict(list)

          for res in root.rglob("res"):
              if not res.is_dir():
                  continue

              if any(part in {".git", ".gradle", "build"}
                     for part in res.parts):
                  continue

              for resource_dir in res.iterdir():
                  if not resource_dir.is_dir():
                      continue

                  if resource_dir.name.startswith("values"):
                      continue

                  for file in resource_dir.iterdir():
                      if not file.is_file():
                          continue

                      if file.suffix.lower() not in image_ext:
                          continue

                      # Android treats extensions as one resource key.
                      name = file.name.split(".", 1)[0].lower()
                      groups[(resource_dir, name)].append(file)

          errors = [
              files for files in groups.values()
              if len(files) > 1
          ]

          if errors:
              print("DUPLICATE ANDROID RESOURCES:")
              for files in errors:
                  for file in files:
                      print(" -", file)
              sys.exit(1)

          print("Android image resource uniqueness: PASSED")
          PY

      - name: Validate Splash Color Resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          splash = Path("app/src/main/res/drawable/ic_splash.xml")
          colors = Path("app/src/main/res/values/ic_launcher_background.xml")

          try:
              splash_root = ET.parse(splash).getroot()
              colors_root = ET.parse(colors).getroot()
          except ET.ParseError as exc:
              print("XML parsing failed:", exc)
              sys.exit(1)

          defined = {
              item.attrib["name"]: (item.text or "").strip()
              for item in colors_root
              if item.tag == "color" and "name" in item.attrib
          }

          required = {
              "ic_launcher_background_tint": "#171B1C",
              "ic_launcher_foreground_tint": "#FFFFFF",
          }

          for name, expected in required.items():
              actual = defined.get(name)
              if actual != expected:
                  print(f"Missing or incorrect color: {name}: {actual}")
                  sys.exit(1)

          for name in required:
              if f"@color/{name}" not in splash_root.attrib.values() and not any(
                  f"@color/{name}" in value
                  for element in splash_root.iter()
                  for value in element.attrib.values()
              ):
                  print(f"Splash drawable does not reference {name}")
                  sys.exit(1)

          print("Splash color resources: PASSED")
          PY
      - name: Prepare Debug Signing Key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app

          if [[ ! -f app/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          keytool -list \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey

          echo "Temporary CI debug signing key ready."

      - name: Build Project
        run: ./gradlew assembleDebug

      - name: Run Local Tests
        run: ./gradlew test

      - name: Lint Checks
        run: ./gradlew ktlintCheck

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-debug-apks-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
          retention-days: 14
