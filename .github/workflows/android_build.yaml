name: Nova Player Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Nova Player APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build Debug & Release APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare Release APK Assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/NovaPlayer.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/novaplayer-v2.5.0-universal.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/novaplayer-v2.5.0-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/novaplayer-v2.5.0-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/novaplayer-v2.5.0-x86_64.apk
          cp app/build/outputs/apk/release/app-x86-release.apk dist/novaplayer-v2.5.0-x86.apk

      - name: Upload artifact novaplayer-universal-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-Release-APKs
          path: dist/*.apk

      - name: Upload artifact novaplayer-universal-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: novaplayer-universal-debug.apk
          path: ./app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload artifact novaplayer-arm64-v8a-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: novaplayer-arm64-v8a-debug.apk
          path: ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
